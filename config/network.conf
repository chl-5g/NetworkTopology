# 固定配置：键名必须全大写；须包含下列全部项，无默认值。
# LAN_PREFIX_LEN：A/B 在此前缀下相同则为「同网段」拓扑 A—SW1—B；否则为跨网段
# A—SW1—路由器—SW2—B（跨网段时 A 须在 192.168.1.0/24、B 须在 10.0.0.0/8）。

LAN_PREFIX_LEN=24

NODE_A_ID=1
NODE_B_ID=2
SWITCH_PORT_COUNT=2

NODE_A_IP=192.168.1.10
NODE_B_IP=10.0.0.20
NODE_A_GW_IP=192.168.1.1

NODE_A_MAC=00:00:00:00:00:0A
NODE_B_MAC=00:00:00:00:00:0B
NODE_A_GW_MAC=00:00:00:00:01:01

UDP_SPORT=49152
UDP_DPORT=50000

USE_SM4=1

PACKET_FILE=data/payload.txt
